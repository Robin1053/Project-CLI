version: 2
updates:
  - package-ecosystem: "npm"        # gilt auch für pnpm und yarn
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-deps:
        patterns: ["*"]             # alles in einem PR statt einem PR pro Paket

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
