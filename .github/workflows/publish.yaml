name: Publish package

"on":
  release:
    types: [published]

jobs:
  # Trusted Publishing (OIDC): kein NPM_TOKEN-Secret nötig. npm tauscht den
  # GitHub-Actions-OIDC-Token (id-token: write) automatisch gegen einen
  # kurzlebigen Publish-Token, sofern auf npmjs.com für dieses Paket ein
  # Trusted Publisher auf genau dieses Repo + diese Workflow-Datei zeigt.
  # Setup passiert auf npmjs.com (Login nötig, nicht hier automatisierbar).
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build
      - run: npm publish --access public

  # Zweiter, unabhängiger Job: veröffentlicht dieselbe Version zusätzlich
  # unter dem gescopten Namen @robin1053/project-cli auf GitHub Packages,
  # damit das Repo das Packages-Widget in der Sidebar zeigt. Die eigentliche
  # Installation für alle anderen bleibt über npmjs.com (project-cli, ohne
  # Scope, anonym per `npm i -g`), dieser Job ist nur für die Sichtbarkeit.
  publish-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://npm.pkg.github.com"
          scope: "@robin1053"

      - run: npm ci
      - run: npm run build
      - run: npm pkg set name="@robin1053/project-cli"

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
