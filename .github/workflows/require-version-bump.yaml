name: Require version bump

# Blockiert PRs nach master, deren package.json-Version nicht höher ist
# als der letzte Release-Tag -> als "required check" in der
# Branch-Protection von master eingetragen. PRs ohne Release-Bedarf
# (z.B. reine CI-/Doku-Änderungen) bekommen das Label "no-release" und
# überspringen den Check.
"on":
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/compare-version
        id: compare

      - name: Version muss höher sein als der letzte Tag
        if: steps.compare.outputs.higher != 'true'
        run: |
          echo "::error::package.json-Version (${{ steps.compare.outputs.current }}) ist nicht höher als der letzte Release-Tag. Bitte Version bumpen (z.B. npm version patch/minor/major) oder PR mit dem Label 'no-release' versehen."
          exit 1
