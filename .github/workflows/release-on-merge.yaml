name: Release on merge

# Nach dem Merge einer PR in master: Wenn package.json hoeher ist als der
# letzte Tag, wird Tag + GitHub-Release angelegt und auf npm + GitHub
# Packages veroeffentlicht. Die Version selbst setzt vorher version-bump.yaml
# im PR-Branch.

"on":
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    # Nur echte Merges, geschlossene PRs ohne Merge loesen nichts aus.
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    outputs:
      higher: ${{ steps.compare.outputs.higher }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/compare-version
        id: compare

  release:
    needs: check-version
    if: needs.check-version.outputs.higher == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag und GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes

  publish:
    needs: [check-version, release]
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yaml
    with:
      ref: ${{ needs.check-version.outputs.tag }}
