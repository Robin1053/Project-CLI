name: Release on version bump

# Läuft nach jedem Push/Merge auf master (z.B. PR-Accept von devolopment).
# Prüft, ob package.json eine höhere Version als der letzte Git-Tag trägt,
# und legt in dem Fall automatisch Tag + GitHub-Release an und ruft den
# bestehenden Publish-Workflow direkt auf (siehe publish.yaml, workflow_call).
"on":
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      higher: ${{ steps.compare.outputs.higher }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/compare-version
        id: compare

  tag-and-release:
    needs: check-version
    if: needs.check-version.outputs.higher == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Tag ist NICHT GPG-signiert (CI hat keinen privaten Schlüssel) -
      # anders als die manuell per `git tag -s` gesetzten Tags bisher.
      - name: Tag und GitHub-Release anlegen
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUSTOM_TAG: ${{ needs.check-version.outputs.tag }}

  publish:
    needs: [check-version, tag-and-release]
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yaml
